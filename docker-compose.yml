services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ledgerly_dev
      POSTGRES_USER: ledgerly
      POSTGRES_PASSWORD: ledgerly_local_only
    ports:
      - "5432:5432"
    volumes:
      - ledgerly_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerly -d ledgerly_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  ledgerly_postgres:
