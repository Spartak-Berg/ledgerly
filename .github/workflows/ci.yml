name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json
      - name: Install dependencies
        run: npm run install:all
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Check frontend
        run: npm run lint --prefix apps/web && npm run build --prefix apps/web
      - name: Check backend
        run: npm run lint:check --prefix apps/api && npm run test --prefix apps/api -- --runInBand && npm run build --prefix apps/api
        env:
          DATABASE_URL: postgresql://ledgerly:ci-only@localhost:5432/ledgerly_ci
